name: Login Debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx playwright install --with-deps

      - name: Run Debug Test
        env:
          CW_USERNAME: ${{ secrets.CW_USERNAME }}
          CW_PASSWORD: ${{ secrets.CW_PASSWORD }}
        run: |
          npx playwright test tests/debug/login-debug.spec.js

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: login-debug
          path: |
            step*.png
            test-results
            playwright-report
